[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpv-dvr-cleaner"
version = "0.5.1"
description = "Video engine for restoring analog and HDZero FPV DVR recordings"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=2,<3", "opencv-python-headless>=4.10,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flugbild = ["assets/*.ttf", "assets/*.txt"]
