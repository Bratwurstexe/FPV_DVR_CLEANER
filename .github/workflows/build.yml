name: Desktop builds

# Builds ready-to-run packages: desktop app, frozen video engine and FFmpeg.
# Pushes to main build and test; a version tag (v*) also publishes a release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            rid: win-x64
            # GPL builds: the engine encodes with libx264, which LGPL builds lack.
            ffmpeg: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          - runner: ubuntu-24.04
            rid: linux-x64
            ffmpeg: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          - runner: macos-15
            rid: osx-arm64
            ffmpeg: https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release
          - runner: macos-15-intel
            rid: osx-x64
            ffmpeg: https://ffmpeg.martin-riedl.de/redirect/latest/macos/amd64/release
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download FFmpeg
        run: |
          mkdir -p ffmpeg-bundle ffmpeg-download
          case "${{ matrix.rid }}" in
            win-x64)
              curl -sSL -o ffmpeg-download/ff.zip "${{ matrix.ffmpeg }}"
              unzip -q ffmpeg-download/ff.zip -d ffmpeg-download
              cp ffmpeg-download/*/bin/ffmpeg.exe ffmpeg-download/*/bin/ffprobe.exe ffmpeg-bundle/
              cp ffmpeg-download/*/LICENSE.txt ffmpeg-bundle/FFMPEG-LICENSE.txt ;;
            linux-x64)
              curl -sSL -o ffmpeg-download/ff.tar.xz "${{ matrix.ffmpeg }}"
              tar -xf ffmpeg-download/ff.tar.xz -C ffmpeg-download
              cp ffmpeg-download/*/bin/ffmpeg ffmpeg-download/*/bin/ffprobe ffmpeg-bundle/
              cp ffmpeg-download/*/LICENSE.txt ffmpeg-bundle/FFMPEG-LICENSE.txt ;;
            osx-*)
              for tool in ffmpeg ffprobe; do
                curl -sSL -o "ffmpeg-download/$tool.zip" "${{ matrix.ffmpeg }}/$tool.zip"
                unzip -q -o "ffmpeg-download/$tool.zip" -d ffmpeg-bundle
              done
              printf '%s\n' "Static FFmpeg build from https://ffmpeg.martin-riedl.de (GPL)." \
                "Source code: https://ffmpeg.org/download.html" > ffmpeg-bundle/FFMPEG-LICENSE.txt ;;
          esac
          chmod +x ffmpeg-bundle/ffmpeg* ffmpeg-bundle/ffprobe* || true
          ffmpeg-bundle/ffmpeg -hide_banner -version | head -1
          if ! ffmpeg-bundle/ffmpeg -hide_banner -encoders | grep -q libx264; then
            echo "::error title=FFmpeg::The downloaded FFmpeg has no libx264 encoder"; exit 1
          fi
          # Windows programs (Python) need a Windows path here; "/d/a/…" from Git Bash is not found.
          if command -v cygpath >/dev/null 2>&1; then cygpath -w "$PWD/ffmpeg-bundle"; else echo "$PWD/ffmpeg-bundle"; fi >> "$GITHUB_PATH"

      - name: Install the engine dependencies
        run: python -m pip install "numpy>=2,<3" "opencv-python-headless>=4.10,<6" "pyinstaller>=6.10"

      # The engine tests skip everything that needs FFmpeg when it is missing; on Windows they
      # did so unnoticed for a long time. Without FFmpeg visible to Python the build stops here.
      - name: Check that the tests see FFmpeg
        run: |
          python -c "import shutil, sys; found = [t for t in ('ffmpeg', 'ffprobe') if shutil.which(t)]; print('FFmpeg tools on PATH:', found); sys.exit(0 if len(found) == 2 else 1)" || { echo "::error title=FFmpeg::ffmpeg and ffprobe are not on PATH for Python, so the engine tests would skip"; exit 1; }

      - name: Test the video engine
        run: |
          set +e
          PYTHONPATH=src python -m unittest discover -s tests -v > test-output.txt 2>&1
          status=$?
          cat test-output.txt
          if [ $status -ne 0 ]; then
            # Annotations are readable without signing in, unlike raw logs.
            # One annotation per failing test with its whole traceback (%0A is a line break there).
            python - "${{ matrix.rid }}" <<'EOF'
          import re, sys
          text = open("test-output.txt", encoding="utf-8", errors="replace").read()
          for block in re.split(r"\n={20,}\n", text)[1:9]:
              body = block.split("\n" + "-" * 70 + "\n", 1)
              name = body[0].strip()
              trace = (body[1] if len(body) > 1 else "").strip()[-3500:]
              trace = trace.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=Engine test on {sys.argv[1]}: {name[:120]}::{trace}")
          EOF
          fi
          exit $status

      - name: Freeze the video engine
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --name flugbild-engine \
            --paths src --add-data "src/flugbild/assets:flugbild/assets" --exclude-module PySide6 --exclude-module tkinter \
            --distpath engine-dist --workpath engine-build packaging/engine_entry.py

      - name: Publish the desktop app
        run: dotnet publish desktop/FpvDvrCleaner.Desktop/FpvDvrCleaner.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:DebugType=none -o app

      - name: Assemble the package
        run: |
          cp -r engine-dist/flugbild-engine app/engine
          mkdir -p app/ffmpeg && cp ffmpeg-bundle/* app/ffmpeg/
          cp README.md LICENSE THIRD-PARTY-NOTICES.md app/
          cp packaging/START-HERE.txt app/
          chmod +x app/FpvDvrCleaner.Desktop app/engine/flugbild-engine 2>/dev/null || true
          # Smoke test: the frozen engine answers a request with the bundled FFmpeg.
          PATH="$PWD/app/ffmpeg:$PATH" ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=160x96:rate=10 -t 1 -c:v libx264 -pix_fmt yuv420p smoke.mp4
          # The Windows engine needs a Windows path, not the shell's /d/a/... form.
          clip="$PWD/smoke.mp4"; command -v cygpath > /dev/null && clip=$(cygpath -m "$clip")
          printf '{"action":"inspect","source":"%s"}' "$clip" > smoke.json
          engine=app/engine/flugbild-engine; [ -f "$engine.exe" ] && engine="$engine.exe"
          PATH="$PWD/app/ffmpeg:$PATH" "$engine" smoke.json | tee smoke.out
          if ! grep -q '"result"' smoke.out; then
            echo "::error title=Engine smoke test on ${{ matrix.rid }}::$(tr '\n' ' ' < smoke.out)"
            exit 1
          fi
          # The bundled files the engine needs at run time (0.4.0 shipped without them).
          for asset in Inter.ttf INTER-OFL.txt; do
            if [ ! -f "app/engine/_internal/flugbild/assets/$asset" ]; then
              echo "::error title=Engine package on ${{ matrix.rid }}::$asset is missing from engine/_internal/flugbild/assets"; exit 1
            fi
          done
          # A real export through the frozen engine, with and without a caption, started
          # from another working directory: this is what the desktop app does.
          mkdir -p smoke-out && cd smoke-out
          for caption in "" "Smoke test"; do
            printf '{"action":"export","source":"%s","target":"%s","mode":"manual","recipe":{"signalart":"digital","blockpflege":0,"untertiteltext":"%s"}}' \
              "$clip" "${clip%.mp4}-cleaned.mp4" "$caption" > export.json
            PATH="$PWD/../app/ffmpeg:$PATH" "../$engine" export.json | tee export.out
            if ! grep -q '"result"' export.out || [ ! -s "../smoke-cleaned.mp4" ]; then
              echo "::error title=Engine export test on ${{ matrix.rid }}::caption='$caption': $(tr '\n' ' ' < export.out)"
              exit 1
            fi
            rm -f ../smoke-cleaned.mp4
          done
          # Two kept parts of the trim editor are rendered and joined into one file.
          printf '{"action":"export","source":"%s","target":"%s","mode":"manual","segments":[[0,0.4],[0.6,1.0]],"recipe":{"signalart":"digital","blockpflege":0}}' "$clip" "${clip%.mp4}-parts.mp4" > parts.json
          PATH="$PWD/../app/ffmpeg:$PATH" "../$engine" parts.json | tee parts.out
          if ! grep -q '"result"' parts.out || [ ! -s "../smoke-parts.mp4" ]; then
            echo "::error title=Engine parts export on ${{ matrix.rid }}::$(tr '\n' ' ' < parts.out)"
            exit 1
          fi
          rm -f ../smoke-parts.mp4
          cd ..

      # The packaged engine, run like the app runs it, on realistic clips: sound shorter and
      # longer than the picture, no sound, OSD removal with hand corrections, every format,
      # trims, preview, mask editor and Share. Lengths, sizes and sound are checked, so an
      # export that quietly cuts the video short fails too (0.7.1 broke on whole clips).
      - name: Release check of the packaged engine
        run: |
          engine=app/engine/flugbild-engine; [ -f "$engine.exe" ] && engine="$engine.exe"
          set +e
          PATH="$PWD/app/ffmpeg:$PATH" python tools/release_check.py "$engine" --work release-check > release-check.txt 2>&1
          status=$?
          cat release-check.txt
          if [ $status -ne 0 ]; then
            grep -E "^FAIL" release-check.txt | head -20 | while read -r line; do
              echo "::error title=Release check on ${{ matrix.rid }}::$line"
            done
          fi
          exit $status

      - name: Build the launcher
        run: |
          dotnet publish desktop/FpvDvrCleaner.Launcher/FpvDvrCleaner.Launcher.csproj -c Release -r ${{ matrix.rid }} -o launcher
          case "${{ matrix.rid }}" in
            win-x64)
              cp launcher/FpvDvrCleaner.Launcher.exe FPV-DVR-Cleaner-Launcher-windows-x64.exe ;;
            linux-x64)
              # A tar.gz keeps the executable bit that a plain download would lose.
              mkdir -p launcher-pkg && cp launcher/FpvDvrCleaner.Launcher launcher-pkg/FPV-DVR-Cleaner-Launcher
              chmod +x launcher-pkg/FPV-DVR-Cleaner-Launcher
              tar -czf FPV-DVR-Cleaner-Launcher-linux-x64.tar.gz -C launcher-pkg FPV-DVR-Cleaner-Launcher ;;
            osx-*)
              bundle="FPV DVR Cleaner Launcher.app"
              mkdir -p "$bundle/Contents/MacOS" "$bundle/Contents/Resources"
              cp launcher/FpvDvrCleaner.Launcher "$bundle/Contents/MacOS/" && chmod +x "$bundle/Contents/MacOS/FpvDvrCleaner.Launcher"
              version="${{ github.ref_name }}"
              sed "s/@VERSION@/${version#v}/" packaging/launcher-Info.plist > "$bundle/Contents/Info.plist"
              codesign --force --deep --sign - "$bundle" || true
              arch=$([ "${{ matrix.rid }}" = osx-arm64 ] && echo apple-silicon || echo intel)
              ditto -c -k --keepParent "$bundle" "FPV-DVR-Cleaner-Launcher-macos-$arch.zip" ;;
          esac
          ls -la FPV-DVR-Cleaner-Launcher-*

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Rename-Item app "FPV-DVR-Cleaner"
          Compress-Archive -Path "FPV-DVR-Cleaner" -DestinationPath "FPV-DVR-Cleaner-${{ github.ref_name }}-windows-x64.zip"

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: |
          # The desktop app is published as one executable; only native .so files may remain.
          if ls app/*.dll > /dev/null 2>&1; then
            echo "::error title=Linux package::managed .dll files found next to the app; PublishSingleFile is not in effect"; exit 1
          fi
          cp packaging/linux/fpv-dvr-cleaner.desktop app/
          mv app FPV-DVR-Cleaner
          tar -czf "FPV-DVR-Cleaner-${{ github.ref_name }}-linux-x64.tar.gz" FPV-DVR-Cleaner

      - name: Build the AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          appdir=AppDir
          mkdir -p "$appdir/usr/lib/fpv-dvr-cleaner" "$appdir/usr/share/applications" "$appdir/usr/share/icons/hicolor/256x256/apps"
          cp -r FPV-DVR-Cleaner/. "$appdir/usr/lib/fpv-dvr-cleaner/"
          cp packaging/linux/AppRun "$appdir/AppRun" && chmod +x "$appdir/AppRun"
          cp packaging/linux/fpv-dvr-cleaner.desktop "$appdir/"
          cp packaging/linux/fpv-dvr-cleaner.desktop "$appdir/usr/share/applications/"
          cp desktop/FpvDvrCleaner.Desktop/Assets/app.png "$appdir/fpv-dvr-cleaner.png"
          cp desktop/FpvDvrCleaner.Desktop/Assets/app.png "$appdir/usr/share/icons/hicolor/256x256/apps/fpv-dvr-cleaner.png"
          ln -s fpv-dvr-cleaner.png "$appdir/.DirIcon"
          curl -sSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$appdir" "FPV-DVR-Cleaner-${{ github.ref_name }}-linux-x64.AppImage"
          chmod +x "FPV-DVR-Cleaner-${{ github.ref_name }}-linux-x64.AppImage"
          ls -la FPV-DVR-Cleaner-*.AppImage

      - name: Build the app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          bundle="FPV DVR Cleaner.app"
          mkdir -p "$bundle/Contents/MacOS" "$bundle/Contents/Resources"
          cp -R app/. "$bundle/Contents/MacOS/"
          cp desktop/FpvDvrCleaner.Desktop/Assets/app.png "$bundle/Contents/Resources/app.png"
          version="${{ github.ref_name }}"
          sed "s/@VERSION@/${version#v}/" packaging/Info.plist > "$bundle/Contents/Info.plist"
          # Ad-hoc signature so Apple Silicon starts the binaries; not notarised.
          codesign --force --deep --sign - "$bundle" || true
          arch=$([ "${{ matrix.rid }}" = osx-arm64 ] && echo apple-silicon || echo intel)
          ditto -c -k --keepParent "$bundle" "FPV-DVR-Cleaner-${{ github.ref_name }}-macos-$arch.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: FPV-DVR-Cleaner-${{ matrix.rid }}
          path: FPV-DVR-Cleaner-*.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: FPV-DVR-Cleaner-*
          path: release-assets
          merge-multiple: true
      # The launcher finds packages by these exact names; a release without one of them
      # would leave that system without updates.
      - name: Check the package names the launcher expects
        run: |
          for suffix in windows-x64.zip macos-apple-silicon.zip macos-intel.zip linux-x64.AppImage linux-x64.tar.gz; do
            if [ ! -s "release-assets/FPV-DVR-Cleaner-${{ github.ref_name }}-$suffix" ]; then
              echo "::error title=Release assets::FPV-DVR-Cleaner-${{ github.ref_name }}-$suffix is missing"; exit 1
            fi
          done
          for launcher in windows-x64.exe linux-x64.tar.gz macos-apple-silicon.zip macos-intel.zip; do
            if [ ! -s "release-assets/FPV-DVR-Cleaner-Launcher-$launcher" ]; then
              echo "::error title=Release assets::FPV-DVR-Cleaner-Launcher-$launcher is missing"; exit 1
            fi
          done
      - name: Checksums
        run: cd release-assets && sha256sum FPV-DVR-Cleaner-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      # The download links at the top of the notes point at this release's own files.
      - name: Release notes with this version's links
        run: |
          sed "s/{TAG}/${{ github.ref_name }}/g" packaging/RELEASE-NOTES.md > release-notes.md
          if grep -q "{TAG}" release-notes.md; then echo "::error title=Release notes::{TAG} left in the notes"; exit 1; fi
      # GitHub adds the source code (zip and tar.gz) to every release by itself.
      - uses: softprops/action-gh-release@v2
        with:
          name: FPV DVR Cleaner ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-assets/*
          make_latest: true
      # Only the newest release keeps its notes open; older ones fold their "New in …"
      # sections and downloads. Text only: tags, files and the latest mark stay.
      - name: Fold the notes of older releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/collapse_old_releases.py "${{ github.ref_name }}" || echo "::warning title=Release notes::the notes of older releases could not be folded"
